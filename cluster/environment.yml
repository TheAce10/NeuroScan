name: neuroscan
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pip

  # PyTorch with CUDA 12.4 support
  - pytorch>=2.3.0
  - torchvision>=0.18.0
  - pytorch-cuda=12.4

  # Core ML / data
  - numpy>=1.26
  - scikit-learn>=1.4
  - pandas>=2.2
  - pillow>=10.0
  - tqdm>=4.66
  - matplotlib>=3.8

  # pip-only packages
  - pip:
      - kaggle>=1.6.17          # Kaggle CLI for dataset download
      - huggingface_hub>=0.22   # optional: upload weights to HuggingFace Hub
